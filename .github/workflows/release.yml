name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          wails build -ldflags "-X main.versionOverride=$VERSION"

      - name: Ad-hoc sign
        run: codesign --force --deep --sign - build/bin/velfi.app

      - name: Create DMG
        run: hdiutil create -volname Velfi -srcfolder build/bin/velfi.app -ov -format UDZO velfi-mac.dmg

      - uses: actions/upload-artifact@v5
        with:
          name: velfi-mac
          path: velfi-mac.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          wails build -nsis -ldflags "-X main.versionOverride=$version"

      - name: Find and rename installer
        run: |
          Get-ChildItem -Path build/bin -Recurse
          $installer = Get-ChildItem -Path build/bin -Filter "*installer.exe" -Recurse | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName velfi-windows.exe
          } else {
            Copy-Item build/bin/velfi.exe velfi-windows.exe
          }

      - uses: actions/upload-artifact@v5
        with:
          name: velfi-windows
          path: velfi-windows.exe

  deploy-vercel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Build & deploy to Vercel
        working-directory: frontend
        env:
          BUILD_TARGET: vercel
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          pnpm install
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          VITE_APP_VERSION=$VERSION pnpm run build
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Velfi ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/velfi-mac.dmg \
            artifacts/velfi-windows.exe
